<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VM-DMZ-WEB | Secure Server</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --success-color: #22c55e;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 450px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        h1 {
            margin-top: 0;
            font-size: 1.8rem;
            color: var(--accent-color);
        }
        p {
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: rgba(34, 197, 94, 0.1);
            color: var(--success-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }
        .dot {
            width: 8px;
            height: 8px;
            background-color: var(--success-color);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success-color);
        }
        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 15px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>VM-DMZ-WEB</h1>
        <p>Le serveur web sécurisé en DMZ est opérationnel et chiffre les communications via HTTPS.</p>
        <div class="badge">
            <div class="dot"></div>
            HTTPS / TLS Actif
        </div>
        <div class="footer">
            Environnement Ubuntu &bull; Nginx Web Server
        </div>
    </div>
</body>
</html>
